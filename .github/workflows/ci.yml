name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ORCHESTRA_COMPATIBILITY_EVIDENCE_PROFILE: github-actions-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22.12.0 }
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- tsc --noEmit
      - run: npm install -g @openai/codex@0.144.6
      - run: npm run check:codex-protocol
      - run: npx tsc --noEmit
      - run: npm test
      - run: ./scripts/e2e.sh
      - run: npm run build
      - run: node dist/cli.js doctor --provider both --json
      - run: npm pack --dry-run
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22.12.0, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
