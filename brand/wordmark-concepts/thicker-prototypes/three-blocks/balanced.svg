    <path id="middle" d="M-26-19H26L20 19H-20Z"/>
    <path id="inner" d="M-34-19H34L27 19H-27Z"/>
  </defs>
  <g transform="translate(256 170)">
    <g fill="#A1A19B"><use href="#outer" transform="translate(-142 -20) rotate(-55)"/><use href="#outer" transform="translate(0 -108)"/><use href="#outer" transform="translate(142 -20) rotate(55)"/></g>
    <g fill="#62625D"><use href="#middle" transform="translate(-103 32) rotate(-47)"/><use href="#middle" transform="translate(0 -44)"/><use href="#middle" transform="translate(103 32) rotate(47)"/></g>
    <g fill="#111111"><use href="#inner" transform="translate(-65 72) rotate(-36)"/><use href="#inner" transform="translate(0 25)"/><use href="#inner" transform="translate(65 72) rotate(36)"/><path d="M-40 105H40V121H-40Z"/></g>
  </g>
</svg>
