<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0c11">
  <title>Orchestra Cloud</title>
  <meta name="description" content="Orchestra Cloud is being prepared for private preview.">
  <style>
    :root {
      color-scheme: dark;
      font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0c11;
      color: #e9ebf2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        #0a0c11;
      background-size: 44px 44px;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: clamp(32px, 7vw, 68px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(16,19,26,.94);
      box-shadow: 0 28px 80px rgba(0,0,0,.34);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand img { width: 48px; height: auto; }
    .brand span { font-size: 19px; font-weight: 650; letter-spacing: -.035em; }
    .eyebrow {
      margin: 58px 0 14px;
      color: #45e07f;
      font: 500 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 58px); line-height: 1.02; letter-spacing: -.045em; }
    .lede { max-width: 52ch; margin: 22px 0 0; color: #a5abb7; font-size: 17px; line-height: 1.65; }
    .status {
      margin-top: 42px;
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a5abb7;
      font: 500 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #45e07f;
      box-shadow: 0 0 0 5px rgba(69,224,127,.12);
    }
    @media (max-width: 560px) {
      main { width: min(100% - 24px, 680px); padding: 30px 24px; }
      .eyebrow { margin-top: 46px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="orchestra-mark-reversed.svg" alt="" width="48" height="30" aria-hidden="true">
      <span>orchestra</span>
    </div>
    <p class="eyebrow">Private preview</p>
    <h1>Orchestra Cloud is taking the stage.</h1>
    <p class="lede">The hosted workspace for shared boards, organizations, and secure agent coordination is being connected now.</p>
    <p class="status">Cloudflare edge ready · application backend preparing</p>
  </main>
</body>
</html>
